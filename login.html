<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sign In — Sites by Rensé</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --black:#000; --white:#fff; --green:#2ecc71; --gray:#888; }
  body { font-family: 'Georgia', Georgia, serif; background: var(--black); color: var(--white); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; }

  .back { position: fixed; top: 1.4rem; left: 2rem; font-size: 0.72rem; letter-spacing: 0.28em; text-transform: uppercase; color: var(--gray); text-decoration: none; transition: color 0.2s; }
  .back:hover { color: var(--white); }

  .card { width: 100%; max-width: 420px; border: 1px solid #222; padding: 3rem 2.5rem; }
  .card-title { font-size: 1.8rem; font-weight: 400; letter-spacing: 0.04em; margin-bottom: 0.4rem; }
  .card-sub { font-size: 0.85rem; color: var(--gray); font-style: italic; margin-bottom: 2.2rem; line-height: 1.5; }

  .tabs { display: flex; border-bottom: 1px solid #222; margin-bottom: 2rem; }
  .tab { flex: 1; padding: 0.65rem; text-align: center; font-size: 0.72rem; letter-spacing: 0.25em; text-transform: uppercase; color: var(--gray); cursor: pointer; border-bottom: 2px solid transparent; transition: color 0.2s, border-color 0.2s; }
  .tab.active { color: var(--white); border-bottom-color: var(--white); }

  .form-section { display: none; }
  .form-section.active { display: block; }

  .field { margin-bottom: 1.2rem; }
  .field label { display: block; font-size: 0.68rem; letter-spacing: 0.28em; text-transform: uppercase; color: var(--gray); margin-bottom: 0.45rem; }
  .field input { width: 100%; background: transparent; border: 1px solid #2a2a2a; padding: 0.75rem 1rem; font-family: 'Georgia', Georgia, serif; font-size: 0.88rem; color: var(--white); outline: none; transition: border-color 0.2s; }
  .field input:focus { border-color: #555; }
  .field input::placeholder { color: #444; }

  .btn-primary { width: 100%; padding: 0.95rem; background: var(--white); color: var(--black); border: none; font-family: 'Georgia', Georgia, serif; font-size: 0.78rem; letter-spacing: 0.25em; text-transform: uppercase; cursor: pointer; transition: background 0.2s; margin-top: 0.4rem; }
  .btn-primary:hover { background: var(--green); }

  .msg { font-size: 0.8rem; margin-top: 1.2rem; text-align: center; min-height: 1.2rem; }
  .msg.error { color: #e74c3c; font-style: italic; }
  .msg.success { color: var(--green); font-style: italic; }
</style>
</head>
<body>

<a href="index.html" class="back">← Back</a>

<div class="card">
  <h1 class="card-title">Welcome back.</h1>
  <p class="card-sub">Sign in or create an account to manage your project.</p>

  <div class="tabs">
    <div class="tab active" data-tab="signin">Sign In</div>
    <div class="tab" data-tab="signup">Create Account</div>
  </div>

  <!-- SIGN IN -->
  <div class="form-section active" id="tab-signin">
    <div class="field"><label>Email</label><input type="email" id="si-email" placeholder="your@email.com"/></div>
    <div class="field"><label>Password</label><input type="password" id="si-pass" placeholder="••••••••"/></div>
    <button class="btn-primary" id="btn-signin">Sign In</button>
    <p class="msg" id="si-msg"></p>
  </div>

  <!-- SIGN UP -->
  <div class="form-section" id="tab-signup">
    <div class="field"><label>Full Name</label><input type="text" id="su-name" placeholder="Your full name"/></div>
    <div class="field"><label>Email</label><input type="email" id="su-email" placeholder="your@email.com"/></div>
    <div class="field"><label>Phone Number</label><input type="tel" id="su-phone" placeholder="+1 000 000 0000"/></div>
    <div class="field"><label>Password</label><input type="password" id="su-pass" placeholder="At least 6 characters"/></div>
    <button class="btn-primary" id="btn-signup">Create Account</button>
    <p class="msg" id="su-msg"></p>
  </div>
</div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
  import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, updateProfile, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
  import { getFirestore, doc, setDoc, getDoc } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_AUTH_DOMAIN",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_STORAGE_BUCKET",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  const app  = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db   = getFirestore(app);

  // Redirect if already logged in
  onAuthStateChanged(auth, (user) => {
    if (user) window.location.href = 'profile.html';
  });

  // Tabs
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab, .form-section').forEach(el => el.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
    });
  });

  // Sign In
  document.getElementById('btn-signin').addEventListener('click', async () => {
    const email = document.getElementById('si-email').value.trim();
    const pass  = document.getElementById('si-pass').value;
    const msg   = document.getElementById('si-msg');
    msg.className = 'msg'; msg.textContent = '';
    try {
      await signInWithEmailAndPassword(auth, email, pass);
      window.location.href = 'profile.html';
    } catch(e) {
      msg.className = 'msg error';
      msg.textContent = 'Invalid email or password.';
    }
  });

  // Sign Up
  document.getElementById('btn-signup').addEventListener('click', async () => {
    const name  = document.getElementById('su-name').value.trim();
    const email = document.getElementById('su-email').value.trim();
    const phone = document.getElementById('su-phone').value.trim();
    const pass  = document.getElementById('su-pass').value;
    const msg   = document.getElementById('su-msg');
    msg.className = 'msg'; msg.textContent = '';
    if (!name || !email || !pass) { msg.className='msg error'; msg.textContent='Please fill in all required fields.'; return; }
    try {
      const cred = await createUserWithEmailAndPassword(auth, email, pass);
      await updateProfile(cred.user, { displayName: name });
      await setDoc(doc(db, 'users', cred.user.uid), { name, email, phone, createdAt: new Date().toISOString() });
      window.location.href = 'profile.html';
    } catch(e) {
      msg.className = 'msg error';
      msg.textContent = e.message.includes('email-already') ? 'That email is already registered.' : 'Something went wrong. Try again.';
    }
  });
</script>
</body>
</html>
