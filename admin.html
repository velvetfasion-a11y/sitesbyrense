<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Admin — Sites by Rensé</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --black:#000; --white:#fff; --green:#2ecc71; --gray:#888; --red:#e74c3c; --orange:#f39c12; }
  body { font-family: 'Georgia', Georgia, serif; background: #080808; color: var(--white); min-height: 100vh; }

  /* LOGIN GATE */
  #login-gate { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
  .gate-card { width: 100%; max-width: 360px; border: 1px solid #222; padding: 2.8rem 2.2rem; }
  .gate-title { font-size: 1.5rem; font-weight: 400; margin-bottom: 0.3rem; }
  .gate-sub { font-size: 0.8rem; color: var(--gray); font-style: italic; margin-bottom: 2rem; }
  .field { margin-bottom: 1.1rem; }
  .field label { display: block; font-size: 0.65rem; letter-spacing: 0.28em; text-transform: uppercase; color: var(--gray); margin-bottom: 0.4rem; }
  .field input { width: 100%; background: transparent; border: 1px solid #2a2a2a; padding: 0.7rem 0.9rem; font-family: 'Georgia', Georgia, serif; font-size: 0.88rem; color: var(--white); outline: none; }
  .field input:focus { border-color: #555; }
  .field input::placeholder { color: #444; }
  .btn-gate { width: 100%; padding: 0.85rem; background: var(--white); color: var(--black); border: none; font-family: 'Georgia', Georgia, serif; font-size: 0.75rem; letter-spacing: 0.25em; text-transform: uppercase; cursor: pointer; margin-top: 0.4rem; transition: background 0.2s; }
  .btn-gate:hover { background: var(--green); }
  .gate-err { color: var(--red); font-size: 0.78rem; font-style: italic; margin-top: 0.8rem; text-align: center; min-height: 1rem; }

  /* DASHBOARD */
  #dashboard { display: none; }

  /* TOP BAR */
  .topbar { display: flex; justify-content: space-between; align-items: center; padding: 1.2rem 2rem; border-bottom: 1px solid #1a1a1a; position: sticky; top: 0; background: #080808; z-index: 100; }
  .topbar-brand { font-size: 0.72rem; letter-spacing: 0.35em; text-transform: uppercase; color: var(--gray); }
  .topbar-right { display: flex; align-items: center; gap: 1.5rem; }
  .admin-badge { font-size: 0.65rem; letter-spacing: 0.25em; text-transform: uppercase; color: var(--green); border: 1px solid var(--green); padding: 0.25rem 0.7rem; }
  .btn-sm { padding: 0.5rem 1.2rem; font-family: 'Georgia', Georgia, serif; font-size: 0.65rem; letter-spacing: 0.2em; text-transform: uppercase; cursor: pointer; border: none; transition: background 0.2s; }
  .btn-out { background: transparent; color: var(--gray); border: 1px solid #333; }
  .btn-out:hover { color: var(--white); border-color: #666; }

  /* STATS */
  .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 1px; background: #1a1a1a; margin: 2rem; }
  .stat { background: #080808; padding: 1.5rem; text-align: center; }
  .stat-num { font-size: 2rem; font-weight: 400; letter-spacing: -0.02em; }
  .stat-label { font-size: 0.65rem; letter-spacing: 0.28em; text-transform: uppercase; color: var(--gray); margin-top: 0.3rem; }
  .stat-num.green { color: var(--green); }
  .stat-num.orange { color: var(--orange); }

  /* MESSAGES TABLE */
  .section { padding: 0 2rem 3rem; }
  .section-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
  .section-title { font-size: 0.72rem; letter-spacing: 0.35em; text-transform: uppercase; color: var(--gray); }
  .filter-row { display: flex; gap: 0.5rem; }
  .filter-btn { padding: 0.35rem 0.9rem; font-family: 'Georgia', Georgia, serif; font-size: 0.65rem; letter-spacing: 0.18em; text-transform: uppercase; cursor: pointer; background: transparent; color: var(--gray); border: 1px solid #2a2a2a; transition: all 0.2s; }
  .filter-btn.active, .filter-btn:hover { color: var(--white); border-color: #555; }

  .msg-card { border: 1px solid #1a1a1a; margin-bottom: 1px; transition: border-color 0.2s; }
  .msg-card:hover { border-color: #333; }
  .msg-header { display: flex; justify-content: space-between; align-items: center; padding: 1.2rem 1.5rem; cursor: pointer; }
  .msg-client { display: flex; flex-direction: column; gap: 0.2rem; }
  .msg-name { font-size: 0.95rem; letter-spacing: 0.03em; }
  .msg-email { font-size: 0.75rem; color: var(--gray); }
  .msg-meta { display: flex; align-items: center; gap: 1.2rem; }
  .msg-date { font-size: 0.65rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--gray); }
  .status-pill { font-size: 0.6rem; letter-spacing: 0.2em; text-transform: uppercase; padding: 0.2rem 0.65rem; border: 1px solid; }
  .pill-new { color: var(--gray); border-color: #333; }
  .pill-pending { color: var(--orange); border-color: var(--orange); }
  .pill-paid { color: var(--green); border-color: var(--green); }
  .chevron { color: var(--gray); font-size: 0.7rem; transition: transform 0.2s; }
  .msg-card.open .chevron { transform: rotate(180deg); }

  .msg-body { display: none; padding: 0 1.5rem 1.5rem; border-top: 1px solid #1a1a1a; }
  .msg-card.open .msg-body { display: block; }
  .msg-desc { font-size: 0.9rem; color: #ccc; line-height: 1.7; font-style: italic; margin: 1.2rem 0; padding: 1rem; background: #0d0d0d; border-left: 2px solid #2a2a2a; }
  .info-row { display: flex; gap: 2rem; flex-wrap: wrap; margin-bottom: 1.2rem; }
  .info-item { }
  .info-label { font-size: 0.62rem; letter-spacing: 0.25em; text-transform: uppercase; color: var(--gray); margin-bottom: 0.2rem; }
  .info-val { font-size: 0.85rem; }

  .action-row { display: flex; gap: 0.8rem; flex-wrap: wrap; margin-top: 1.2rem; padding-top: 1.2rem; border-top: 1px solid #1a1a1a; align-items: flex-end; }
  .action-group { display: flex; flex-direction: column; gap: 0.35rem; }
  .action-label { font-size: 0.62rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--gray); }
  .action-input { background: transparent; border: 1px solid #2a2a2a; padding: 0.55rem 0.8rem; font-family: 'Georgia', Georgia, serif; font-size: 0.82rem; color: var(--white); outline: none; width: 200px; }
  .action-input:focus { border-color: #555; }
  .action-input::placeholder { color: #444; }
  .btn-action { padding: 0.6rem 1.3rem; font-family: 'Georgia', Georgia, serif; font-size: 0.65rem; letter-spacing: 0.2em; text-transform: uppercase; cursor: pointer; border: none; transition: background 0.2s; white-space: nowrap; }
  .btn-green  { background: var(--green); color: var(--black); }
  .btn-green:hover { background: #27ae60; }
  .btn-white  { background: var(--white); color: var(--black); }
  .btn-white:hover { background: #ddd; }

  /* RECEIPT MODAL */
  #receipt-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 3000; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.3s; padding: 1.5rem; }
  #receipt-overlay.open { opacity: 1; pointer-events: all; }
  .receipt-modal { background: #0a0a0a; border: 1px solid #2a2a2a; width: 100%; max-width: 520px; padding: 2.5rem; position: relative; max-height: 90vh; overflow-y: auto; }
  .receipt-close { position: absolute; top: 1rem; right: 1.3rem; background: none; border: none; color: var(--gray); font-size: 1.4rem; cursor: pointer; }
  .receipt-logo { font-size: 0.72rem; letter-spacing: 0.4em; text-transform: uppercase; color: var(--gray); margin-bottom: 2rem; }
  .receipt-title { font-size: 1.6rem; font-weight: 400; margin-bottom: 0.3rem; }
  .receipt-id { font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gray); margin-bottom: 2rem; }
  .receipt-row { display: flex; justify-content: space-between; padding: 0.7rem 0; border-bottom: 1px solid #1a1a1a; font-size: 0.85rem; }
  .receipt-row:last-of-type { border-bottom: none; }
  .receipt-key { color: var(--gray); }
  .receipt-total { display: flex; justify-content: space-between; padding: 1rem 0; font-size: 1.1rem; border-top: 1px solid #333; margin-top: 0.5rem; }
  .receipt-actions { display: flex; gap: 0.8rem; margin-top: 1.8rem; flex-wrap: wrap; }

  .toast { position: fixed; bottom: 2rem; right: 2rem; background: #1a1a1a; border: 1px solid #333; padding: 1rem 1.5rem; font-size: 0.8rem; letter-spacing: 0.1em; opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 9999; }
  .toast.show { opacity: 1; }

  .empty-state { text-align: center; padding: 4rem 0; color: var(--gray); font-style: italic; }
</style>
</head>
<body>

<!-- LOGIN GATE -->
<div id="login-gate">
  <div class="gate-card">
    <h1 class="gate-title">Admin Access</h1>
    <p class="gate-sub">Restricted to authorised personnel only.</p>
    <div class="field"><label>Username</label><input type="text" id="gate-user" placeholder="velvetadmin.com"/></div>
    <div class="field"><label>Password</label><input type="password" id="gate-pass" placeholder="••••"/></div>
    <button class="btn-gate" id="btn-gate-login">Enter</button>
    <p class="gate-err" id="gate-err"></p>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <div class="topbar">
    <span class="topbar-brand">Sites by Rensé</span>
    <div class="topbar-right">
      <span class="admin-badge">Admin</span>
      <button class="btn-sm btn-out" id="btn-admin-logout">Sign Out</button>
    </div>
  </div>

  <div class="stats-row">
    <div class="stat"><div class="stat-num" id="stat-total">—</div><div class="stat-label">Total Requests</div></div>
    <div class="stat"><div class="stat-num orange" id="stat-new">—</div><div class="stat-label">New</div></div>
    <div class="stat"><div class="stat-num" id="stat-pending">—</div><div class="stat-label">Pending Payment</div></div>
    <div class="stat"><div class="stat-num green" id="stat-paid">—</div><div class="stat-label">Paid</div></div>
  </div>

  <div class="section">
    <div class="section-head">
      <span class="section-title">Customer Messages</span>
      <div class="filter-row">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="new">New</button>
        <button class="filter-btn" data-filter="pending_payment">Pending</button>
        <button class="filter-btn" data-filter="paid">Paid</button>
      </div>
    </div>
    <div id="messages-list"><p class="empty-state">Loading...</p></div>
  </div>
</div>

<!-- RECEIPT MODAL -->
<div id="receipt-overlay">
  <div class="receipt-modal">
    <button class="receipt-close" onclick="closeReceipt()">&times;</button>
    <div class="receipt-logo">Sites by Rensé</div>
    <h2 class="receipt-title">Receipt</h2>
    <p class="receipt-id" id="r-id"></p>
    <div id="r-rows"></div>
    <div class="receipt-total"><span>Total</span><span id="r-total"></span></div>
    <div class="receipt-actions">
      <button class="btn-action btn-white" id="btn-email-receipt">Email Receipt</button>
      <button class="btn-action btn-green" onclick="closeReceipt()">Done</button>
    </div>
    <p id="receipt-msg" style="font-size:0.78rem;color:#888;font-style:italic;margin-top:1rem;min-height:1rem;"></p>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- EmailJS -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
  import { getFirestore, collection, getDocs, doc, updateDoc, orderBy, query } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_AUTH_DOMAIN",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_STORAGE_BUCKET",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  // ── REPLACE WITH YOUR EMAILJS KEYS ──
  const EMAILJS_SERVICE  = 'YOUR_EMAILJS_SERVICE_ID';
  const EMAILJS_TEMPLATE = 'YOUR_EMAILJS_TEMPLATE_ID';
  const EMAILJS_KEY      = 'YOUR_EMAILJS_PUBLIC_KEY';

  emailjs.init(EMAILJS_KEY);

  const app = initializeApp(firebaseConfig);
  const db  = getFirestore(app);

  let allMessages = [];
  let currentFilter = 'all';
  let receiptData = {};

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3200);
  }

  // ── ADMIN LOGIN GATE ──
  const ADMIN_USER = 'velvetadmin.com';
  const ADMIN_PASS = '1111';

  document.getElementById('btn-gate-login').addEventListener('click', () => {
    const u = document.getElementById('gate-user').value.trim();
    const p = document.getElementById('gate-pass').value;
    if (u === ADMIN_USER && p === ADMIN_PASS) {
      sessionStorage.setItem('admin_auth', '1');
      document.getElementById('login-gate').style.display = 'none';
      document.getElementById('dashboard').style.display  = 'block';
      loadMessages();
    } else {
      document.getElementById('gate-err').textContent = 'Incorrect credentials.';
    }
  });

  // Allow Enter key
  ['gate-user','gate-pass'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('btn-gate-login').click();
    });
  });

  if (sessionStorage.getItem('admin_auth') === '1') {
    document.getElementById('login-gate').style.display = 'none';
    document.getElementById('dashboard').style.display  = 'block';
    loadMessages();
  }

  document.getElementById('btn-admin-logout').addEventListener('click', () => {
    sessionStorage.removeItem('admin_auth');
    document.getElementById('login-gate').style.display = 'flex';
    document.getElementById('dashboard').style.display  = 'none';
  });

  // ── FILTERS ──
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      renderMessages();
    });
  });

  // ── LOAD MESSAGES ──
  async function loadMessages() {
    const q = query(collection(db, 'messages'), orderBy('createdAt','desc'));
    const snaps = await getDocs(q);
    allMessages = snaps.docs.map(d => ({ id: d.id, ...d.data() }));
    updateStats();
    renderMessages();
  }

  function updateStats() {
    document.getElementById('stat-total').textContent   = allMessages.length;
    document.getElementById('stat-new').textContent     = allMessages.filter(m => m.status === 'new').length;
    document.getElementById('stat-pending').textContent = allMessages.filter(m => m.status === 'pending_payment').length;
    document.getElementById('stat-paid').textContent    = allMessages.filter(m => m.status === 'paid').length;
  }

  function renderMessages() {
    const list = document.getElementById('messages-list');
    const filtered = currentFilter === 'all' ? allMessages : allMessages.filter(m => m.status === currentFilter);
    if (!filtered.length) { list.innerHTML = '<p class="empty-state">No messages here yet.</p>'; return; }

    list.innerHTML = filtered.map(m => {
      const date = m.createdAt ? new Date(m.createdAt.toDate()).toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'}) : '—';
      const pillClass = m.status === 'paid' ? 'pill-paid' : m.status === 'pending_payment' ? 'pill-pending' : 'pill-new';
      const pillLabel = m.status === 'paid' ? 'Paid' : m.status === 'pending_payment' ? 'Pending' : 'New';

      return `<div class="msg-card" data-id="${m.id}">
        <div class="msg-header" onclick="toggleCard('${m.id}')">
          <div class="msg-client">
            <span class="msg-name">${m.name || '—'}</span>
            <span class="msg-email">${m.email || '—'}</span>
          </div>
          <div class="msg-meta">
            <span class="msg-date">${date}</span>
            <span class="status-pill ${pillClass}">${pillLabel}</span>
            <span class="chevron">▼</span>
          </div>
        </div>
        <div class="msg-body">
          <p class="msg-desc">${m.description || 'No description provided.'}</p>
          <div class="info-row">
            <div class="info-item"><p class="info-label">Phone</p><p class="info-val">${m.phone || '—'}</p></div>
            <div class="info-item"><p class="info-label">Email</p><p class="info-val">${m.email || '—'}</p></div>
            <div class="info-item"><p class="info-label">Status</p><p class="info-val">${pillLabel}</p></div>
          </div>
          <div class="action-row">
            <div class="action-group">
              <span class="action-label">Amount ($)</span>
              <input class="action-input" id="amount-${m.id}" placeholder="e.g. 499" value="${m.paymentAmount || ''}"/>
            </div>
            <div class="action-group">
              <span class="action-label">Stripe Payment Link</span>
              <input class="action-input" id="link-${m.id}" placeholder="https://buy.stripe.com/..." value="${m.paymentLink || ''}"/>
            </div>
            <button class="btn-action btn-green" onclick="sendPaymentLink('${m.id}','${m.email}','${m.name}')">Send Link</button>
            <button class="btn-action btn-white" onclick="openReceipt('${m.id}')">Receipt</button>
          </div>
        </div>
      </div>`;
    }).join('');
  }

  window.toggleCard = function(id) {
    const card = document.querySelector(`.msg-card[data-id="${id}"]`);
    card.classList.toggle('open');
  };

  // ── SEND PAYMENT LINK ──
  window.sendPaymentLink = async function(id, email, name) {
    const amount = document.getElementById(`amount-${id}`).value.trim();
    const link   = document.getElementById(`link-${id}`).value.trim();
    if (!amount || !link) { showToast('Enter amount and Stripe link first.'); return; }

    // Save to Firestore
    await updateDoc(doc(db, 'messages', id), {
      paymentAmount: amount,
      paymentLink: link,
      status: 'pending_payment'
    });

    // Email via EmailJS
    try {
      await emailjs.send(EMAILJS_SERVICE, EMAILJS_TEMPLATE, {
        to_email: email,
        to_name: name,
        payment_link: link,
        amount: amount,
        subject: `Your payment link — Sites by Rensé`
      });
      showToast(`Payment link sent to ${email} ✓`);
    } catch(e) {
      showToast('Saved to Firestore. EmailJS not configured yet.');
    }

    // Refresh
    const idx = allMessages.findIndex(m => m.id === id);
    if (idx > -1) { allMessages[idx].paymentAmount = amount; allMessages[idx].paymentLink = link; allMessages[idx].status = 'pending_payment'; }
    updateStats();
    renderMessages();
  };

  // ── RECEIPT ──
  window.openReceipt = function(id) {
    const m = allMessages.find(m => m.id === id);
    if (!m) return;
    receiptData = m;

    const rid = 'REC-' + id.slice(-6).toUpperCase();
    const date = m.createdAt ? new Date(m.createdAt.toDate()).toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'}) : new Date().toLocaleDateString();

    document.getElementById('r-id').textContent = rid + ' · ' + date;
    document.getElementById('r-rows').innerHTML = `
      <div class="receipt-row"><span class="receipt-key">Client</span><span>${m.name || '—'}</span></div>
      <div class="receipt-row"><span class="receipt-key">Email</span><span>${m.email || '—'}</span></div>
      <div class="receipt-row"><span class="receipt-key">Phone</span><span>${m.phone || '—'}</span></div>
      <div class="receipt-row"><span class="receipt-key">Service</span><span>Website Design &amp; Development</span></div>
      <div class="receipt-row"><span class="receipt-key">Description</span><span style="max-width:240px;text-align:right;font-style:italic;">${m.description || '—'}</span></div>
      <div class="receipt-row"><span class="receipt-key">Status</span><span style="color:${m.status==='paid'?'#2ecc71':'#f39c12'}">${m.status === 'paid' ? 'Paid' : 'Pending Payment'}</span></div>
    `;
    document.getElementById('r-total').textContent = m.paymentAmount ? `$${m.paymentAmount}` : '—';
    document.getElementById('receipt-msg').textContent = '';

    const ov = document.getElementById('receipt-overlay');
    ov.classList.add('open');
  };

  window.closeReceipt = function() {
    document.getElementById('receipt-overlay').classList.remove('open');
  };

  document.getElementById('receipt-overlay').addEventListener('click', (e) => {
    if (e.target === document.getElementById('receipt-overlay')) closeReceipt();
  });

  document.getElementById('btn-email-receipt').addEventListener('click', async () => {
    const m = receiptData;
    if (!m.email) { showToast('No email on file.'); return; }
    const msgEl = document.getElementById('receipt-msg');
    const rid = 'REC-' + m.id.slice(-6).toUpperCase();
    const date = m.createdAt ? new Date(m.createdAt.toDate()).toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'}) : new Date().toLocaleDateString();

    try {
      await emailjs.send(EMAILJS_SERVICE, EMAILJS_TEMPLATE, {
        to_email: m.email,
        to_name: m.name,
        receipt_id: rid,
        date,
        amount: m.paymentAmount || '—',
        description: m.description || '—',
        status: m.status === 'paid' ? 'Paid' : 'Pending Payment',
        subject: `Your receipt — Sites by Rensé`
      });
      // Mark as paid
      await updateDoc(doc(db, 'messages', m.id), { status: 'paid' });
      const idx = allMessages.findIndex(x => x.id === m.id);
      if (idx > -1) allMessages[idx].status = 'paid';
      updateStats(); renderMessages();
      msgEl.textContent = `Receipt sent to ${m.email} ✓`;
      msgEl.style.color = '#2ecc71';
      showToast('Receipt emailed ✓');
    } catch(e) {
      msgEl.textContent = 'EmailJS not configured yet — add your keys.';
      msgEl.style.color = '#e74c3c';
    }
  });
</script>
</body>
</html>
